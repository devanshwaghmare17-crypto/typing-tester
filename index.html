<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed & Accuracy Tester</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Typing Speed Tester</h1>
      <p>Start typing the passage below to begin the 60-second timer.</p>
    </header>

    <section class="telemetry-grid" aria-label="Typing Statistics">
      <div class="stat-card">
        <span class="stat-label">Time Left</span>
        <span class="stat-value" id="time-display">60s</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Mistakes</span>
        <span class="stat-value" id="mistakes-display">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Net WPM</span>
        <span class="stat-value" id="wpm-display">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Accuracy</span>
        <span class="stat-value" id="accuracy-display">100%</span>
      </div>
    </section>

    <section class="typing-area">
      <div id="quote-display" class="quote-box" aria-live="polite"></div>
      <textarea
        id="quote-input"
        class="input-box"
        rows="4"
        placeholder="Click here and start typing..."
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      ></textarea>
    </section>

    <div class="controls">
      <button id="restart-btn" class="btn-primary" type="button">Restart Test</button>
    </div>

    <div id="results-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <h2>Test Complete!</h2>
        <div class="modal-stats">
          <p><strong>Final Net WPM:</strong> <span id="final-wpm">0</span></p>
          <p><strong>Accuracy:</strong> <span id="final-acc">100%</span></p>
          <p><strong>Total Mistakes:</strong> <span id="final-mistakes">0</span></p>
        </div>
        <button id="modal-restart-btn" class="btn-primary" type="button">Try Another Quote</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
